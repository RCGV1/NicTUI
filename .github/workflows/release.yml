name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: read

jobs:
  build-macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target x86_64-apple-darwin --bin nictui

      - name: Rename binary
        run: mv target/x86_64-apple-darwin/release/nictui nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64

  build-macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target aarch64-apple-darwin --bin nictui

      - name: Rename binary
        run: mv target/aarch64-apple-darwin/release/nictui nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-aarch64
          path: nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc --bin nictui

      - name: Rename binary
        run: mv target/x86_64-pc-windows-msvc/release/nictui.exe nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-windows-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe

  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libudev-dev

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin nictui

      - name: Rename binary
        run: mv target/x86_64-unknown-linux-gnu/release/nictui nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-linux-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64

  # ARM build disabled - requires cross-rs/cross for proper GTK3/wayland support
  # To re-enable:
  # 1. Use cross-rs/cross for cross-compilation with pre-built Docker images
  # 2. Configure Cross.toml with GTK3 dependencies for ARM target
  # 3. Add back to create-release.needs array
  #
  # build-linux-arm:
  #   runs-on: ubuntu-latest
  #   name: Build ARM64
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: taiki-e/install-action@v2
  #       with:
  #         tool: cross
  #     - name: Build Release
  #       run: cross build --release --target aarch64-unknown-linux-gnu --bin nictui
  #     - name: Rename binary
  #       run: mv target/aarch64-unknown-linux-gnu/release/nictui nictui-${{ github.ref_name }}-linux-aarch64
  #     - name: Upload artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: nictui-linux-aarch64
  #         path: nictui-${{ github.ref_name }}-linux-aarch64

  create-release:
    needs: [build-linux-x86_64, build-macos-x86_64, build-macos-aarch64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > checksums.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/nictui-linux-x86_64/*
            artifacts/nictui-macos-x86_64/*
            artifacts/nictui-macos-aarch64/*
            artifacts/nictui-windows-x86_64/*
            artifacts/checksums.txt
          body: |
            ## Download Binaries

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64` |
            | macOS x86_64 (Intel) | `nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64` |
            | macOS aarch64 (Apple Silicon) | `nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64` |
            | Windows x86_64 | `nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe` |

            ## Note

            Linux ARM builds are temporarily disabled. See GitHub Actions workflow for status.

            ## Verification

            Verify checksums:
            ```
            sha256sum -c checksums.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
