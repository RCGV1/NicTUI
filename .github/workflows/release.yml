name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: read

env:
  RUST_BACKTRACE: 1

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.check_tag.outputs.exists != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if version tag already exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          if gh api "repos/${REPO}/git/refs/tags/v${VERSION}" --silent 2>/dev/null; then
            echo "Tag v${VERSION} already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v${VERSION} does not exist - will create release"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output version check result
        run: |
          echo "Version: ${{ steps.version.outputs.VERSION }}"
          echo "Should release: ${{ steps.check_tag.outputs.exists != 'true' }}"

  build-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target x86_64-apple-darwin --bin nictui

      - name: Rename binary
        run: mv target/x86_64-apple-darwin/release/nictui nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64

  build-macos-aarch64:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target aarch64-apple-darwin --bin nictui

      - name: Rename binary
        run: mv target/aarch64-apple-darwin/release/nictui nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-aarch64
          path: nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = Select-String -Path 'Cargo.toml' -Pattern '^version = ' | ForEach-Object { $_.Line -replace '.*?"(.*?)".*', '$1' }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: cargo build --release --target x86_64-pc-windows-msvc --bin nictui

      - name: Rename binary
        run: mv target/x86_64-pc-windows-msvc/release/nictui.exe nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-windows-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe

  build-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libudev-dev

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin nictui

      - name: Rename binary
        run: mv target/x86_64-unknown-linux-gnu/release/nictui nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-linux-x86_64
          path: nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64

  create-release:
    needs: [check-version, build-linux-x86_64, build-macos-x86_64, build-macos-aarch64, build-windows]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > checksums.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: |
            artifacts/nictui-linux-x86_64/*
            artifacts/nictui-macos-x86_64/*
            artifacts/nictui-macos-aarch64/*
            artifacts/nictui-windows-x86_64/*
            artifacts/checksums.txt
          body: |
            ## Download Binaries

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `nictui-${{ steps.version.outputs.VERSION }}-linux-x86_64` |
            | macOS x86_64 (Intel) | `nictui-${{ steps.version.outputs.VERSION }}-macos-x86_64` |
            | macOS aarch64 (Apple Silicon) | `nictui-${{ steps.version.outputs.VERSION }}-macos-aarch64` |
            | Windows x86_64 | `nictui-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe` |

            ## Note

            Linux ARM builds are temporarily disabled. See GitHub Actions workflow for status.

            ## Verification

            Verify checksums:
            ```
            sha256sum -c checksums.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
