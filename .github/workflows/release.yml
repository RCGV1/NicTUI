name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libwayland-client0 wayland-protocols libasound2-dev libudev-dev pkg-config

      - name: Build Release
        run: cargo build --release --bin nictui

      - name: Strip binary
        run: strip target/release/nictui

      - name: Rename binary
        run: mv target/release/nictui nictui-${{ github.ref_name }}-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-linux-x86_64
          path: nictui-${{ github.ref_name }}-linux-x86_64

  build-linux-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build for ARM
        run: |
          docker run --rm --platform linux/arm64/v8 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            arm64v8/rust:latest \
            cargo build --release --bin nictui

      - name: Rename binary
        run: mv target/release/nictui nictui-${{ github.ref_name }}-linux-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-linux-aarch64
          path: nictui-${{ github.ref_name }}-linux-aarch64

  build-macos-x86_64:
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: cargo build --release --bin nictui

      - name: Rename binary
        run: mv target/release/nictui nictui-${{ github.ref_name }}-macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-x86_64
          path: nictui-${{ github.ref_name }}-macos-x86_64

  build-macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: cargo build --release --bin nictui

      - name: Rename binary
        run: mv target/release/nictui nictui-${{ github.ref_name }}-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-macos-aarch64
          path: nictui-${{ github.ref_name }}-macos-aarch64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Release
        run: cargo build --release --bin nictui

      - name: Rename binary
        run: mv target/release/nictui.exe nictui-${{ github.ref_name }}-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nictui-windows-x86_64
          path: nictui-${{ github.ref_name }}-windows-x86_64.exe

  create-release:
    needs: [build-linux-x86_64, build-linux-arm, build-macos-x86_64, build-macos-aarch64, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} \; > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nictui-linux-x86_64/*
            artifacts/nictui-linux-aarch64/*
            artifacts/nictui-macos-x86_64/*
            artifacts/nictui-macos-aarch64/*
            artifacts/nictui-windows-x86_64/*
            artifacts/checksums.txt
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          body: |
            ## Download Binaries

            | Platform | File |
            |----------|------|
            | Linux x86_64 | `nictui-${{ github.ref_name }}-linux-x86_64` |
            | Linux ARM (Raspberry Pi) | `nictui-${{ github.ref_name }}-linux-aarch64` |
            | macOS x86_64 (Intel) | `nictui-${{ github.ref_name }}-macos-x86_64` |
            | macOS aarch64 (Apple Silicon) | `nictui-${{ github.ref_name }}-macos-aarch64` |
            | Windows x86_64 | `nictui-${{ github.ref_name }}-windows-x86_64.exe` |

            ## Verification

            Verify checksums:
            ```
            sha256sum -c checksums.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
